name: Deploy Admin to S3

# TODO: GitHub Repository Settings > Secrets에 아래 5가지 값을 등록해야 합니다:
# 1. AWS_ACCESS_KEY_ID
# 2. AWS_SECRET_ACCESS_KEY
# 3. AWS_REGION
# 4. S3_BUCKET_NAME (Terraform output 참고)
# 5. CLOUDFRONT_DISTRIBUTION_ID (Terraform output 참고)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/admin/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Admin
        run: pnpm build --filter admin

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync apps/admin/dist s3://${{ secrets.S3_BUCKET_NAME }} --delete
